# Alembic configuration.
#
# The database URL is intentionally NOT set here - `alembic/env.py` reads it
# from the application settings so that migrations, the ETL and the API can
# never disagree about which database they are pointed at.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Timestamped, slug-suffixed revision filenames sort chronologically and are
# readable at a glance, unlike bare hashes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

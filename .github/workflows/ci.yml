# =============================================================================
# CI: backend tests, frontend lint/typecheck/build, and Docker image builds.
#
# The three jobs are independent and run in parallel; docker-images additionally
# waits on the two that can fail fast, so a broken test does not burn several
# minutes of image build time.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the workflow be re-run by hand from the Actions tab.
  workflow_dispatch:

# A new push to the same branch cancels the previous, still-running CI - the
# older result is already obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. The image job raises this for itself when it needs to
# push to GHCR, rather than granting write to the whole workflow.
permissions:
  contents: read

jobs:
  # --------------------------------------------------------------- backend --
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres is provided even though the suite runs on SQLite by default:
    # it lets the DATABASE_URL path be exercised against a real server, and
    # catches anything that silently depends on SQLite semantics.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail
          POSTGRES_DB: retail_insights_test
        ports:
          - 5432:5432
        # Without a healthcheck the job races the container's startup and the
        # first connection intermittently fails.
        options: >-
          --health-cmd "pg_isready -U retail -d retail_insights_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Caches the pip download dir, keyed on the requirements file.
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pytest
        # `working-directory: backend` matches how the suite is run locally;
        # pytest's rootdir detection and the conftest path setup both depend
        # on it.
        working-directory: backend
        env:
          ENVIRONMENT: test
          # In-memory-equivalent temp SQLite file: the tests build their own
          # fixtures and must never touch a developer's seeded warehouse.
          DATABASE_URL: sqlite:///./test_ci.db
          LOG_LEVEL: WARNING
        run: python -m pytest -v --tb=short

      - name: Apply Alembic migrations to Postgres
        # Proves the migration runs on the real target engine, not just SQLite -
        # a column type or constraint Postgres rejects fails here rather than on
        # a reviewer's first `docker compose up`.
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://retail:retail@localhost:5432/retail_insights_test
        run: alembic upgrade head

      - name: Verify the suite also passes against Postgres
        # The same tests against a real, migrated schema. The data-dependent
        # assertions self-skip on an empty warehouse (see tests/test_api.py), so
        # what this leg actually proves is that every query compiles and runs on
        # Postgres - catching anything relying on SQLite's looser typing.
        working-directory: backend
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+psycopg2://retail:retail@localhost:5432/retail_insights_test
          LOG_LEVEL: WARNING
        run: python -m pytest -q --tb=short


  # -------------------------------------------------------------- frontend --
  frontend:
    name: Frontend lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` fails loudly if package.json and the lockfile disagree, which
      # is what CI should do - `npm install` would quietly "fix" the drift.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          VITE_API_BASE_URL: http://localhost:8000/api
        run: npm run build

      # Makes the built bundle downloadable from the run summary, which is
      # handy for checking what actually shipped without a local build.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # --------------------------------------------------------- docker images --
  docker-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Both images are built on every run to prove the Dockerfiles are valid.
      # They are only PUSHED on main - a pull request from a fork should not be
      # able to publish an image.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main) the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/api:latest
          # GitHub Actions cache: without it every run recompiles the scientific
          # Python stack from scratch.
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build (and push on main) the frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/web:latest
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'http://localhost:8000/api' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

    # Scoped to this job only, and only needed for the GHCR push above.
    permissions:
      contents: read
      packages: write

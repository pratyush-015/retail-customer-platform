# nginx config for the built SPA.
# Referenced by frontend/Dockerfile; not used by `npm run dev`.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Don't advertise the nginx version on errors and in the Server header.
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml;

    # Vite emits content-hashed filenames under /assets, so a given URL's bytes
    # never change. Cache them for a year and skip revalidation entirely.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html is the opposite case: it is the document that *points* at the
    # hashed bundles, so a cached copy would pin users to a stale deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA history fallback. React Router owns /segments, /churn/:id and friends;
    # without this, a hard refresh on a deep link would 404 because no such file
    # exists on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container-level liveness probe that does not depend on the app bundle.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
